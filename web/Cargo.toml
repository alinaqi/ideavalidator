[package]
name = "ideavalidator-web"
version = "0.1.0"
edition = "2021"
description = "Rust web app + hosted MCP for ideavalidator (reuses the Python pipeline engine)."
license = "MIT"

[lib]
name = "ideavalidator_web"
path = "src/lib.rs"

[[bin]]
name = "ideavalidator-web"
path = "src/main.rs"

[dependencies]
axum = "0.7.9"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "net", "sync", "process", "io-util", "time"] }
sha2 = "0.10.8"
hex = "0.4.3"
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
async-trait = "0.1.83"
aes-gcm = "0.10.3"
base64 = "0.22.1"
rand = "0.8.5"
sqlx = { version = "0.8.2", default-features = false, features = ["runtime-tokio-rustls", "postgres", "macros"] }
reqwest = { version = "0.12.9", default-features = false, features = ["rustls-tls", "json"] }
maud = { version = "0.26.0", features = ["axum"] }
pulldown-cmark = { version = "0.12.2", default-features = false, features = ["html"] }
tokio-stream = { version = "0.1.16", features = ["sync"] }

[dev-dependencies]
tower = { version = "0.5.1", features = ["util"] }
http-body-util = "0.1.2"
